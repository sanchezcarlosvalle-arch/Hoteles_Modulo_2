<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff416c" />
      <stop offset="100%" stop-color="#ff4b2b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="12"/>
  <circle cx="1000" cy="200" r="160" fill="rgba(255,255,255,0.05)" />
  <circle cx="1100" cy="100" r="80" fill="rgba(255,255,255,0.08)" />
  <circle cx="850" cy="300" r="100" fill="rgba(255,255,255,0.04)" />

  <!-- Promo text -->
  <text x="80" y="130" fill="#00d2fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="2">GUÍA HOTELES 2026</text>
  <text x="80" y="190" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800">Elegí la ciudad que te interese</text>
  <text x="80" y="240" fill="#d1d5db" font-family="'Segoe UI', Roboto, sans-serif" font-size="20">Buscá los hoteles de acuerdo a tu preferencia. Realizá la reserva con tus datos.</text>

  <!-- Badge -->
  <rect x="80" y="275" width="220" height="48" rx="24" fill="url(#btnGrad)"/>
  <text x="190" y="306" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">RESERVAR</text>

  <!-- Illustration on the right -->
  <g transform="translate(860, 90)">
    <rect x="0" y="20" width="220" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <rect x="15" y="35" width="190" height="110" rx="4" fill="#0f172a"/>
    <path d="M-20 160 L240 160 L220 180 L0 180 Z" fill="#334155"/>
    <rect x="85" y="165" width="50" height="8" rx="4" fill="#64748b"/>
    <circle cx="110" cy="90" r="30" fill="#0284c7" opacity="0.3"/>
    <path d="M100 80 L125 90 L100 100 Z" fill="#38bdf8"/>
  </g>
</svg>
